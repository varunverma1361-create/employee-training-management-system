services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: etms
      POSTGRES_PASSWORD: etms_local_password
      POSTGRES_DB: etms
    ports: ["5432:5432"]
    volumes: ["etms_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etms"]
      interval: 3s
      retries: 10
volumes:
  etms_data:
